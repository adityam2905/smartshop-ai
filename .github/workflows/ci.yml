name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Deliberately installs only requirements-test.txt, not the full
      # requirements.txt (torch + stable-baselines3 + streamlit) — the unit
      # tests exercise shopping_env.py, scraper.py, evaluation.py, and
      # bandit_baseline.py, none of which need the DQN/UI stack. Keeps CI
      # fast instead of pulling in a multi-hundred-MB torch install.
      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Generate a synthetic dataset (also serves as a smoke test)
        run: python data_generator.py

      - name: Run test suite
        run: pytest -v
