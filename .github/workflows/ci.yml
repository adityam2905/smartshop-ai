name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Deliberately installs only requirements-test.txt, not the full
      # requirements.txt (torch + stable-baselines3 + streamlit) — the unit
      # tests exercise shopping_env.py, scraper.py, evaluation.py,
      # bandit_baseline.py, and supervised_baseline.py, none of which need
      # the DQN/UI stack. Keeps CI fast instead of pulling in a
      # multi-hundred-MB torch install.
      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Generate a synthetic dataset (also serves as a smoke test)
        run: python data_generator.py

      - name: Run test suite
        run: pytest -v

      # Beyond the unit tests above (which exercise internals in isolation),
      # actually run the two baseline scripts end-to-end on the real
      # generated dataset — catches breakage the unit tests wouldn't (CLI
      # arg handling, file I/O, a stray import, etc).
      - name: Smoke-test the contextual bandit baseline
        run: python bandit_baseline.py --train-episodes 5 --episodes 3

      - name: Smoke-test the supervised baseline
        run: python supervised_baseline.py
