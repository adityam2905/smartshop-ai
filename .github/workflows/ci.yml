name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Only requirements-test.txt: everything except the trained model
      # (smartshop/agent.py, train.py) and the Streamlit app runs without
      # torch / stable-baselines3 / streamlit, and skipping them keeps this
      # job fast. The test-full job below covers the rest.
      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Generate a synthetic dataset (also serves as a smoke test)
        run: python -m smartshop.data_generator

      - name: Run test suite
        run: pytest -v

      # Beyond the unit tests above (which exercise internals in isolation),
      # actually run the two baseline scripts end-to-end on the real
      # generated dataset — catches breakage the unit tests wouldn't (CLI
      # arg handling, file I/O, a stray import, etc).
      - name: Smoke-test the contextual bandit baseline
        run: python -m experiments.bandit_baseline --train-episodes 5 --episodes 3

      - name: Smoke-test the supervised baseline
        run: python -m experiments.supervised_baseline

  # The full suite, including the tests the lean job skips: the committed
  # model's behaviour, the online-learning loop, and HTML escaping in app.py.
  # CPU-only torch keeps the install to ~200MB instead of the ~2GB CUDA wheel.
  test-full:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install full dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Generate a synthetic dataset
        run: python -m smartshop.data_generator

      - name: Run full test suite (nothing skipped)
        run: pytest -v -rs
